<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de estratégia em pixel art: unifique os 27 estados do Brasil com líderes históricos.">
<title>Terra Brasilis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>TERRA BRASILIS</h1><div id="bar"></div><button id="campBtn">⚑ Campanha</button><button id="menuBtn" aria-haspopup="dialog">☰ Menu</button></header>
<main>
  <div id="stage">
    <canvas id="map" width="810" height="610" aria-label="Mapa do Brasil"></canvas>
    <div id="tip" hidden></div><div id="hqBar" hidden></div><div id="room" hidden></div>
    <div id="vs" hidden><div class="duel"><figure><img id="vsa" alt=""><figcaption id="vsan"></figcaption></figure><b>VS</b>
      <figure><img id="vsd" alt=""><figcaption id="vsdn"></figcaption></figure></div><div id="vsr"></div></div>
  </div>
  <aside><div id="tut" hidden></div><div id="panel"></div><div id="log"></div></aside>
</main>
<section id="roster" aria-label="Líderes"></section>
<div id="screen" hidden role="dialog"><div id="card"></div></div>
<div id="menu" hidden role="dialog" aria-label="Pausa"><div id="menuBox"></div></div>
<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/base.js"></script>
<script src="js/portraits.js"></script>
<script src="js/map.js"></script>
<script src="js/battle-rules.js"></script>
<script src="js/battle-art.js"></script>
<script src="js/battle.js"></script>
<script src="js/hq.js"></script>
<script src="js/screens.js"></script>
<script src="js/ui.js"></script>
<script src="js/music.js"></script>
<script src="js/assets.js"></script>
<script src="js/main.js"></script>
</body>
</html>

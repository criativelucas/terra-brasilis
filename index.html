<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de estratégia em pixel art: unifique os 27 estados do Brasil com líderes históricos.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Terra Brasilis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* layout: maquete inclinada do Brasil à esquerda, pergaminho de comando à direita, galeria de líderes embaixo */
:root{
  color-scheme:dark;
  --night:#161126; --sea:#1f3a63; --foam:#f1e3a8;
  --paper:#e3c98b; --paper-edge:#8a5a2b; --ink:#3a2413;
  --red:#b3312a; --blue:#1d3fa8; --rod:#5a3a1c;
  --display:"Press Start 2P",ui-monospace,monospace;
  --body:"VT323",ui-monospace,monospace;
}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:20px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
h1{font:14px var(--display);margin:0;color:var(--foam);letter-spacing:1px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
#bar{font-size:22px;flex:1;display:flex;flex-wrap:wrap;gap:6px}
#bar span{background:#2a2140;border:2px solid var(--paper-edge);padding:0 8px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{background:#cfae6a;border:2px solid var(--paper-edge);padding:0 6px;white-space:nowrap}
.ucard{display:flex;gap:8px;align-items:center;background:#d6b877;border:2px solid var(--ink);padding:6px}
.ucard>img{width:78px;height:72px;flex:none}.ucard>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.ulist{display:flex;flex-wrap:wrap;gap:4px}
.ulist button{padding:2px 2px 4px;background:#cfae6a;color:var(--ink);display:flex;flex-direction:column;align-items:center;font-size:8px;box-shadow:none;border:2px solid var(--paper-edge)}
.ulist img{width:39px;height:36px}.ulist .done{opacity:.45}.ulist .cur{border-color:var(--red);background:var(--foam)}
.tri{display:flex;align-items:center;justify-content:center;gap:2px;font:10px var(--display);color:var(--red)}.tri img{width:52px;height:48px}
main{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
img{image-rendering:pixelated}
[hidden]{display:none!important}
#stage{flex:1 1 420px;min-width:0;max-width:810px;position:relative;border:4px solid var(--paper-edge);outline:2px solid var(--rod);overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer;background:var(--sea)}
#tip{position:absolute;pointer-events:none;background:var(--paper);color:var(--ink);border:3px solid var(--paper-edge);
  padding:4px 8px 4px 4px;display:flex;gap:6px;align-items:center;font-size:18px;line-height:1;white-space:nowrap;box-shadow:3px 3px 0 #000}
#tip img{width:48px;height:48px}
#vs{position:absolute;inset:0;background:rgba(10,6,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}
#vs .duel{display:flex;align-items:center;gap:16px}
#vs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:130px;text-align:center;line-height:1}
#vs figure img{width:96px;height:96px;border:4px solid var(--foam)}
#vs b{font:20px var(--display);color:var(--red);text-shadow:2px 2px 0 #000}
#vsr{font:14px var(--display);color:var(--foam);text-shadow:2px 2px 0 #000;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .shake{animation:shake .35s steps(6)}
  #vs figure:first-child{animation:inL .25s steps(5)} #vs figure:last-child{animation:inR .25s steps(5)}
  #menuBox{animation:unroll .2s steps(5)}
}
@keyframes shake{25%{transform:translate(4px,-3px)}50%{transform:translate(-4px,3px)}75%{transform:translate(3px,2px)}}
@keyframes inL{from{transform:translateX(-120px)}} @keyframes inR{from{transform:translateX(120px)}}
@keyframes unroll{from{transform:scaleY(.1)}}
aside{flex:1 1 260px;max-width:340px;min-width:0;background:var(--paper);color:var(--ink);
  border:4px solid var(--paper-edge);box-shadow:4px 4px 0 #000;padding:14px;display:flex;flex-direction:column;gap:10px}
#panel{display:flex;flex-direction:column;gap:10px}
aside h2,#menuBox h2{font:12px/1.5 var(--display);margin:0;color:var(--red);text-wrap:balance}
aside p{margin:0;line-height:1.1}
.who{display:flex;gap:10px;align-items:center}
.who img{width:96px;height:96px;border:4px solid var(--ink);flex:none}
.who div{display:flex;flex-direction:column;gap:6px;min-width:0}
.own{display:flex;gap:8px;align-items:center}.own img{width:32px;height:32px;border:2px solid var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:10px var(--display);padding:8px;background:var(--ink);color:var(--paper);border:0;
  box-shadow:2px 2px 0 var(--paper-edge);cursor:pointer}
button:hover,button:focus-visible{background:var(--red);outline:2px solid var(--foam);outline-offset:1px}
button:disabled{opacity:.4;cursor:default;background:var(--ink)}
button.on,button.danger{background:var(--red)}
button.end{background:var(--blue);color:var(--foam)}
input[type=range]{flex:1;min-width:0;accent-color:var(--red)}
#log{border-top:2px dashed var(--paper-edge);padding-top:8px;font-size:18px;line-height:1.05;display:flex;flex-direction:column;gap:4px}
#roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;max-width:1166px}
#roster button{padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;background:#2a2140;box-shadow:none}
#roster img{width:48px;height:48px}
#roster .me{background:var(--blue)} #roster .sel{outline:2px solid var(--foam)}
#roster .dead{opacity:.35} #roster .dead img{filter:grayscale(1)}
#menu{position:fixed;inset:0;z-index:20;background:rgba(10,6,20,.75);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#menuBox{width:min(360px,100%);background:var(--paper);color:var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center;
  border-inline:4px solid var(--paper-edge);border-block:12px solid var(--rod);box-shadow:6px 6px 0 #000;transform-origin:top}
#screen{position:fixed;inset:0;z-index:15;background:rgba(10,6,20,.62);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#card{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);padding:18px;display:flex;flex-direction:column;gap:10px;
  border-inline:4px solid var(--paper-edge);border-block:12px solid var(--rod);box-shadow:6px 6px 0 #000;line-height:1.1}
#card h2{font:12px/1.5 var(--display);margin:0;color:var(--red);text-align:center;text-wrap:balance}
#card h2.big{font-size:20px;letter-spacing:2px}
#card h3{font:9px var(--display);margin:6px 0 0;letter-spacing:1px}
#card p{margin:0}.c{text-align:center;justify-content:center}
#card .hero{width:120px;height:120px;border:4px solid var(--ink)}
.pb{flex:1;height:10px;background:#bfa468;border:2px solid var(--ink);min-width:40px}.pb i{display:block;height:100%;background:var(--red)}
.st{display:grid;gap:2px;width:64px;flex:none}.st i{height:5px;background:var(--red)}.st i:nth-child(2){background:var(--blue)}.st i:nth-child(3){background:#2f8a4a}
#panel>button{text-align:left}
.rk{display:flex;gap:8px;align-items:center}.rk img{width:32px;height:32px;border:2px solid var(--ink)}.rk span:first-of-type{flex:0 0 118px}
kbd{font:8px var(--display);background:var(--ink);color:var(--paper);padding:2px 4px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:10px var(--display);text-align:left}
.opt button{min-width:168px}
/* acabamento: papel riscado, botões em relevo, molduras */
aside,#card,#menuBox,#room{background:var(--paper) repeating-linear-gradient(0deg,rgba(138,90,43,.07) 0 2px,transparent 2px 6px)}
aside{outline:2px solid var(--rod);outline-offset:-9px}
header{background:#1f1836;border:3px solid var(--paper-edge);padding:8px 12px;box-shadow:4px 4px 0 #000}
h1{text-shadow:2px 2px 0 var(--red)}
button{border-bottom:3px solid rgba(0,0,0,.45);transition:transform .05s}
button:active:not(:disabled){transform:translateY(2px);border-bottom-width:1px}
aside h2{border-bottom:2px solid var(--paper-edge);padding-bottom:4px}
#log div:first-child{color:var(--red)}
#roster button{border:2px solid #3a2f55;border-bottom-width:4px}#roster .me{border-color:#ffd23f}
.who img,.hero,.ucard>img{box-shadow:0 0 0 2px #e0b030,3px 3px 0 2px rgba(0,0,0,.4)}
.chips span{box-shadow:1px 1px 0 rgba(0,0,0,.3)}
/* quartel-general em tela cheia; a sala escolhida abre um painel ao lado */
body.hq{overflow:hidden}
body.hq #stage{position:fixed;inset:0;z-index:12;max-width:none;border:0;outline:0;background:#1d2418;display:flex;align-items:center;justify-content:center}
body.hq canvas{width:min(100vw,calc(100vh*810/610));height:auto}
#hqBar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
#hqBar>*{pointer-events:auto}
#hqBar span{background:var(--paper);color:var(--ink);border:3px solid var(--paper-edge);padding:2px 10px;box-shadow:3px 3px 0 #000}
#room{position:absolute;top:60px;right:16px;bottom:16px;width:min(410px,calc(100% - 32px));overflow:auto;color:var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;
  border-inline:4px solid var(--paper-edge);border-block:12px solid var(--rod);box-shadow:6px 6px 0 #000;line-height:1.1}
#room h2{font:12px/1.5 var(--display);margin:0;color:var(--red);text-align:center}#room p{margin:0}
@media (prefers-reduced-motion:no-preference){#room{animation:slide .25s steps(6)}}
@keyframes slide{from{transform:translateX(110%)}}
</style>
</head>
<body>
<header><h1>TERRA BRASILIS</h1><div id="bar"></div><button id="campBtn">⚑ Campanha</button><button id="menuBtn" aria-haspopup="dialog">☰ Menu</button></header>
<main>
  <div id="stage">
    <canvas id="map" width="810" height="610" aria-label="Mapa do Brasil"></canvas>
    <div id="tip" hidden></div><div id="hqBar" hidden></div><div id="room" hidden></div>
    <div id="vs" hidden><div class="duel"><figure><img id="vsa" alt=""><figcaption id="vsan"></figcaption></figure><b>VS</b>
      <figure><img id="vsd" alt=""><figcaption id="vsdn"></figcaption></figure></div><div id="vsr"></div></div>
  </div>
  <aside><div id="panel"></div><div id="log"></div></aside>
</main>
<section id="roster" aria-label="Líderes"></section>
<div id="screen" hidden role="dialog"><div id="card"></div></div>
<div id="menu" hidden role="dialog" aria-label="Pausa"><div id="menuBox"></div></div>

<script>
// uf, nome, lon, lat, líder, tipo de traço, valor, característica
const S=[
['AC','Acre',-70.5,-9.2,'Plácido de Castro','atk',.3,'Revolução Acreana'],
['AM','Amazonas',-64.5,-4.2,'Ajuricaba','def',.5,'Selva impenetrável'],
['RR','Roraima',-61.4,2,"Lobo d'Almada",'def',.3,'Fortes do Rio Branco'],
['RO','Rondônia',-63,-10.8,'Marechal Rondon','rec',0,'Linhas telegráficas'],
['PA','Pará',-52.5,-4.5,'Eduardo Angelim','atk',.3,'Cabanagem'],
['AP','Amapá',-51.8,1.5,'Cabralzinho','def',.4,'Defesa do Amapá'],
['TO','Tocantins',-48.3,-10.2,'Teotônio Segurado','rec',0,'Autonomia do Norte'],
['MA','Maranhão',-45.2,-5,'Negro Cosme','atk',.2,'Balaiada'],
['PI','Piauí',-42.8,-7.5,'Esperança Garcia','def',.2,'Resistência do sertão'],
['CE','Ceará',-39.5,-5.2,'Dragão do Mar','gold',2,'Jangadeiros'],
['RN','Rio Grande do Norte',-36.6,-5.8,'Felipe Camarão','atk',.3,'Guerreiros potiguares'],
['PB','Paraíba',-36.6,-7.2,'Ariano Suassuna','gold',2,'Movimento Armorial'],
['PE','Pernambuco',-37.8,-8.4,'Frei Caneca','atk',.2,'Confederação do Equador'],
['AL','Alagoas',-36.5,-9.6,'Zumbi dos Palmares','def',.5,'Quilombo dos Palmares'],
['SE','Sergipe',-37.4,-10.6,'Tobias Barreto','rec',0,'Pequeno e aguerrido'],
['BA','Bahia',-41.8,-12.5,'Maria Quitéria','atk',.3,'Independência da Bahia'],
['MT','Mato Grosso',-55.8,-13,'Pascoal Moreira Cabral','gold',2,'Ouro de Cuiabá'],
['GO','Goiás',-50.1,-16,'Cora Coralina','gold',2,'Celeiro do cerrado'],
['DF','Distrito Federal',-47.8,-15.8,'Juscelino Kubitschek','gold',4,'50 anos em 5'],
['MS','Mato Grosso do Sul',-54.8,-20.5,'Guia Lopes','def',.3,'Pantanal'],

// retrato de cada líder: pele, cabelo, cor do cabelo, barba, chapéu, roupa, extras
const L=[
['L','short','k','m','kepi','#56602f','e'],['I','long','k','','cocar','#8c2f1f',''],['L','wig','w','','tricorn','#22386e','c'],
['T','short','g','m','kepi','#8a7a45','e'],['T','short','k','','','#e8e0cc','r'],['T','short','k','b','wide','#3d3226',''],
['L','wig','w','','','#17131c','c'],['D','curly','k','b','','#e8e0cc',''],['D','short','k','','wrap','#7a5a8a','f'],
['B','short','k','m','straw','#e8e0cc',''],['I','long','k','','plume','#5a2a2a','c'],['L','bald','w','','','#d8cfb4',''],
['L','tonsure','b','','','#6b4a2a',''],['D','short','k','b','band','#8c2f1f',''],['B','curly','k','m','','#17131c','c'],
['T','short','k','','shako','#22386e','ef'],['T','long','b','B','wide','#6b4a2a',''],['L','bun','w','','','#3a3550','gcf'],
['L','short','k','','','#2a2f45','t'],['T','short','g','b','wide','#7a4a2f','r'],['L','long','b','B','','#e8e0cc',''],
['L','long','b','','','#8c2f1f','fc'],['L','short','w','B','','#17131c','c'],['L','short','w','s','','#2a2f45','c'],
['L','short','b','b','','#3d3226','t'],['T','bun','k','','','#b3312a','f'],['L','short','k','ms','','#22386e','er']];
// bioma de cada estado (mesma ordem de S): define o campo de batalha e a decoração do mapa
const BOF='ama ama ama ama ama ama cer cer ser ser ser ser ser ser ser ser cer cer cer cer sud sud sud sud sul sul sul'.split(' ');
const BIO={ // g: chão (xadrez), gd/gl: tufos, f: matas, m: morros, mc: cores do morro [claro,escuro,topo]
  ama:{nome:'Selva amazônica',g:['#36a43c','#2f9c37'],gd:'#237d2e',gl:'#6fcf52',tree:'jungle',f:24,m:4,river:1,mesa:1,mc:['#7a7f78','#555a55','#4f9a45']},
  ser:{nome:'Sertão',g:['#eac25e','#e3b955'],gd:'#c4953c',gl:'#f8e09a',tree:'cactus',f:12,m:9,river:0,mesa:1,mc:['#c9824f','#9a5a36','#e0a56f']},
  cer:{nome:'Cerrado',g:['#b9c23c','#b0ba36'],gd:'#8f9a28',gl:'#dbe060',tree:'twist',f:14,m:6,river:0,mesa:1,mc:['#b9895a','#8a6240','#a3ad4c']},
  sud:{nome:'Serras do Sudeste',g:['#5cb83e','#54af39'],gd:'#3b8f2c',gl:'#8cdc5c',tree:'round',f:15,m:10,river:0,mesa:0,mc:['#9a9488','#69645c','#c9c4b8']},
  sul:{nome:'Campos do Sul',g:['#98cc44','#90c43f'],gd:'#6ea52e',gl:'#c0e868',tree:'pine',f:14,m:5,river:1,mesa:0,mc:['#8f958a','#60665e','#bfc5b8']}};
const CFG={mus:.4,vol:.5,tac:0,speed:1,diff:1,shake:1,clash:1}; // tac: 0 sempre tática, 1 só nos ataques, 2 automática
const N=S.length, ix=Object.fromEntries(S.map((s,i)=>[s[0],i]));
const adj=S.map(()=>[]);
('AC:AM,RO;AM:RO,RR,PA,MT;RR:PA;RO:MT;PA:AP,MA,TO,MT;TO:MA,PI,BA,GO,MT;MA:PI;PI:BA,PE,CE;CE:RN,PB,PE;RN:PB;PB:PE;'+
 'PE:BA,AL;AL:SE,BA;SE:BA;BA:GO,MG,ES;MT:GO,MS;GO:MG,MS,DF;DF:MG;MS:MG,SP,PR;MG:SP,RJ,ES;ES:RJ;RJ:SP;SP:PR;PR:SC;SC:RS')
 .split(';').forEach(l=>{const[a,b]=l.split(':');b.split(',').forEach(c=>{adj[ix[a]].push(ix[c]);adj[ix[c]].push(ix[a])})});
// dominar uma região inteira rende ouro extra por turno
const REG=[['Norte','AC AM RR RO PA AP TO',4],['Nordeste','MA PI CE RN PB PE AL SE BA',6],['Centro-Oeste','MT GO DF MS',3],
  ['Sudeste','MG ES RJ SP',5],['Sul','PR SC RS',3]].map(([n,u,b])=>[n,u.split(' ').map(k=>ix[k]),b]);
// rotas marítimas: portos distantes contam como vizinhos
const SEA=[['RS','RJ'],['RJ','PE'],['PE','PA']].map(q=>q.map(k=>ix[k]));SEA.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});

// contorno grosseiro do Brasil (lon,lat); estados = Voronoi dos centros dentro dele
const P=[[-60.2,5.2],[-59.8,4.4],[-58.9,1.2],[-56.5,1.9],[-54,2.2],[-52.5,2.6],[-51.6,4.4],[-50,1.8],[-50,0],[-48.4,-.7],
[-46,-1],[-44.3,-2.4],[-41.5,-2.9],[-38.5,-3.7],[-35.3,-5.2],[-34.8,-7.2],[-35,-9],[-37,-11],[-38.5,-13],[-39,-15.5],
[-39.2,-18],[-40.3,-20.3],[-41,-22],[-42,-23],[-44.5,-23.3],[-46.3,-24],[-48.5,-25.8],[-48.6,-27.6],[-49.8,-29.3],
[-52.1,-32.1],[-53.4,-33.7],[-55.6,-30.9],[-57.6,-30.2],[-55.9,-28.4],[-53.8,-27.2],[-54.6,-25.6],[-54.3,-24],
[-55.6,-22.3],[-57.9,-22.1],[-57.8,-19],[-58.2,-16.3],[-60.2,-16.3],[-60.5,-13.8],[-63,-12.6],[-65.3,-11.5],[-65.3,-9.8],
[-68.7,-11],[-70.6,-11],[-70.6,-9.5],[-73.2,-9.4],[-74,-7.5],[-72.9,-5.1],[-70,-4.3],[-69.4,-1.1],[-69.9,1.7],[-67.1,1.7],
[-66.9,1.2],[-65.5,.8],[-63.4,2.2],[-64.2,4.1],[-61.5,4.3]];
// terra dos vizinhos: costa norte e sul reais; o lado leste corta por dentro do Brasil, que é pintado por cima
const PW=[[-80,12],[-62,10.7],[-60,8.5],[-57.2,6],[-54,5.8],[-51.7,4.6],[-50,-5],[-45,-15],[-50,-28],[-53.5,-33.6],[-54.5,-34.9],[-58,-34.5],[-58,-40],[-80,-40]];
const RIOS=[[[-70,-4.3],[-65,-3.3],[-60,-3.1],[-55,-2.2],[-51,-.8],[-49.6,-.2]],           // Amazonas
  [[-45.5,-19.5],[-44.5,-15],[-43,-11],[-40.5,-9.3],[-36.8,-10.3]],                          // São Francisco
  [[-50.5,-20],[-52.5,-22.5],[-54.4,-25.4]],[[-48.6,-12.5],[-48.2,-8],[-49.2,-5.3],[-49.3,-1.5]]]; // Paraná, Tocantins
const W=81,H=79,X0=-74.5,Y0=5.5,D=.5,C=10;
const inPoly=(x,y,Q=P)=>{let c=false;for(let i=0,j=Q.length-1;i<Q.length;j=i++){const[xi,yi]=Q[i],[xj,yj]=Q[j];
  if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c};
const cell=new Int8Array(W*H).fill(-1); // -1 mar, -2 terra vizinha, >=0 estado
for(let cy=0;cy<H;cy++)for(let cx=0;cx<W;cx++){
  const lon=X0+(cx+.5)*D,lat=Y0-(cy+.5)*D;
  if(!inPoly(lon,lat))continue;

const SAVE='tb-save';
function save(){if(me<0||B||raids.length)return;try{over?localStorage.removeItem(SAVE):
  localStorage.setItem(SAVE,JSON.stringify({owner,troops,gold,me,turn,logs,fort,stats,hq,vet,pact,betray,moved:[...moved]}))}catch{}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(!d||d.owner.length!=N)return false;
  reset();({owner,troops,gold,me,turn,logs,fort,stats}=d);moved=new Set(d.moved);sel=me;if(d.hq)hq=d.hq;hq.tech.art??=0;vet=d.vet||vet;pact=d.pact||{};betray=d.betray||0;return true}catch{return false}}
const wipe=()=>{try{localStorage.removeItem(SAVE)}catch{}};
const savedInfo=()=>{try{const d=JSON.parse(localStorage.getItem(SAVE));return d&&`${S[d.me][4]} · turno ${d.turn} · ${d.owner.filter(o=>o==d.me).length}/${N} estados`}catch{return''}};

function showHelp(){scr(`<h2>Como jogar</h2>

function showEvent(){ // escolha de início de turno: [título, texto, [[opção, custo em ouro, efeito]]]

      <div class="row"><button data-a="bend" class="end" ${dis}>Encerrar rodada ▶</button><button data-a="bauto" ${dis}>Automático</button></div>`;

  let h='';

      <div class="chips"><span>⚔ Tropas ${troops[i]}</span><span>◉ Renda ${inc(i)}</span><span>⛨ Defesa +${Math.round(defOf(i)*100)}%</span>

  if(me<0){pickI=sel;return showSetup()} // antes da campanha, a galeria escolhe o líder
  ui()});
cv.addEventListener('click',e=>{if(cam)return;if(HQ){const k=hqSpot(e);return k&&enterRoom(k)}if(B)return bClick(e);const i=pick(e);if(i<0)return;sfx.sel();
  if(marching&&adj[sel].includes(i))act(i);else{sel=i;marching=false}
  ui()});
cv.addEventListener('mousemove',e=>{const tip=$('tip');if(HQ){tip.hidden=true;HQ.hov=hqSpot(e);return}if(B){tip.hidden=true;B.hov=bCell(e);return}const i=pick(e);
  if(i!=hov){hov=i;draw();
    if(i>=0){let odds='';
      if(marching&&adj[sel].includes(i)&&owner[i]!=me){const n=+($('n')?.value||troops[sel]-1),a=n*(1+trait(sel,'atk')),d=troops[i]*(1+defOf(i))+1;
        odds=`<br><b>Ataque ${a>d*1.3?'favorável':a>d*.8?'arriscado':'temerário'}</b>`}
      tip.innerHTML=`${img(owner[i])}<span><b>${S[i][1]}</b><br>${S[owner[i]][4]}<br>${troops[i]} tropas${fort[i]?' · forte '+fort[i]:''}${odds}</span>`}}
  tip.hidden=i<0;
  if(i>=0){const r=$('stage').getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    tip.style.left=Math.min(mx+14,r.width-tip.offsetWidth-10)+'px';tip.style.top=Math.max(4,my-70)+'px'}});
cv.addEventListener('mouseleave',()=>{hov=-1;$('tip').hidden=true;if(B)B.hov=null;draw()});
// trilha: baião no mapa, marcha em menor na batalha (transposta por bioma), modinha no quartel; [ms por passo, melodia, baixo]
const SONG={map:[190,[67,0,71,72,74,0,72,71,69,0,71,69,67,0,65,0,67,0,71,72,74,0,77,76,74,0,72,71,72,0,0,0],[43,0,0,43,0,0,50,0]],
  bat:[125,[69,0,69,72,76,0,74,72,69,0,69,72,77,76,74,72,68,0,68,71,74,0,72,71,69,72,76,81,80,0,76,0],[45,0,45,0,45,0,52,0]],
  hq:[230,[72,0,0,76,0,0,79,0,77,0,0,76,0,0,74,0,72,0,0,74,0,0,76,0,74,0,0,0,71,0,0,0],[48,0,0,0,55,0,0,0]]};
document.addEventListener('pointerdown',()=>{try{AC=AC||new AudioContext}catch{}},{once:true});
let step=0;
(function tune(){const[ms,mel,bas]=SONG[B?'bat':HQ?'hq':'map'],tr=B?[0,3,-2,5,2][Object.keys(BIO).indexOf(BOF[B.to])]:0;
  if(AC&&CFG.mus&&!document.hidden&&me>=0)try{[[mel[step%32],'square',.03,1.8],[bas[step%8],'triangle',.09,2.6]].forEach(([n,type,v,d])=>{if(!n)return;
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.value=440*2**((n+tr-69)/12);
    g.gain.setValueAtTime(CFG.mus*v,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000*d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+ms/1000*d)})}catch{}
  step++;setTimeout(tune,ms)})();
reset();ui();showTitle();setInterval(()=>{blink=!blink;draw()},450);
document.fonts?.ready.then(draw);
}

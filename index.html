<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de estratégia em pixel art: unifique os 27 estados do Brasil com líderes históricos.">
<title>Terra Brasilis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,700;1,800&family=Alegreya+SC:wght@700&family=Alegreya+Sans:wght@500;700;800&display=swap">
<link rel="icon" href="data:,">
<meta property="og:title" content="Terra Brasilis">
<meta property="og:description" content="Jogo de estratégia em pixel art: unifique os 27 estados do Brasil ou jogue as campanhas históricas.">
<meta property="og:image" content="https://criativelucas.github.io/terra-brasilis/assets/logo.png">

</head>
<body>
<div id="boot" aria-hidden="true"><img src="assets/logo.png" alt=""><i></i></div>
<header><h1><img src="assets/logo-mini.png" alt="Terra Brasilis" width="160" height="105"></h1><div id="bar"></div><button id="councilBtn">📜 Conselho</button><button id="armyBtn">⚔ Exército</button><button id="campBtn">⚑ Campanha</button><button id="menuBtn" aria-haspopup="dialog">☰ Menu</button></header>
<main>
  <div class="col"><div class="view" id="view">
  <div id="stage">
    <canvas id="map" width="810" height="610" aria-label="Mapa do Brasil"></canvas>
    <div id="tip" hidden></div><div id="toasts" aria-live="polite"></div><div id="hqBar" hidden></div><div id="room" hidden></div><div id="cmd" hidden role="menu" aria-label="Comandos"></div><div id="plaque" hidden></div><div id="mapMode" hidden role="group" aria-label="Vista do mapa"></div><div id="talk" hidden role="dialog" aria-label="Diálogo"></div>
    <div id="vs" hidden><div class="duel"><figure><img id="vsa" alt=""><figcaption id="vsan"></figcaption></figure><b>VS</b>
      <figure><img id="vsd" alt=""><figcaption id="vsdn"></figcaption></figure></div><div id="vsr"></div></div>
  </div></div>
    <div id="help" aria-live="polite"><b>Ajuda</b><span id="helpT"></span></div>
    <section id="hand" hidden aria-label="Cartas de estratégia"></section>
  </div>
  <aside><div id="tut" hidden></div><div id="panel"></div><div id="act" hidden></div><div id="log"></div></aside>
<div id="hud"></div><!-- botões redondos e Fim do turno: fora da ficha, que rola (no Safari, fixos dentro de algo que rola são recortados) -->
</main>
<section id="roster" hidden aria-label="Líderes"></section>
<div id="gloss" hidden role="tooltip"></div><div id="tutPtr" hidden aria-hidden="true"></div>
<div id="screen" hidden role="dialog"><div id="card"></div></div>
<div id="menu" hidden role="dialog" aria-label="Pausa"><div id="menuBox"></div></div>
<script>/* ?debug: mostra erros na tela (para navegadores sem console à mão) */if(location.search.includes('debug')){const L=[];const show=()=>{let d=document.getElementById('dbg');if(!d){d=document.createElement('pre');d.id='dbg';d.style.cssText='position:fixed;z-index:999;left:8px;bottom:8px;max-width:60vw;max-height:40vh;overflow:auto;background:#300;color:#fdd;font:12px monospace;padding:8px;white-space:pre-wrap';document.body.appendChild(d)}d.textContent=L.join('\n')+'\n'+navigator.userAgent+'\n'+innerWidth+'x'+innerHeight+' dpr '+devicePixelRatio};addEventListener('error',e=>{L.push((e.filename||'').split('/').pop()+':'+e.lineno+' '+e.message);show()});addEventListener('unhandledrejection',e=>{L.push('promessa: '+e.reason);show()});addEventListener('load',()=>setTimeout(show,1500))}</script>

<script src="js/battle.js?v=20261123203241"></script>
<script src="js/hq.js?v=20261123203241"></script>
<script src="js/screens.js?v=20261123203241"></script>
<script src="js/ui.js?v=20261123203241"></script>
